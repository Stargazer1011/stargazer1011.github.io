site_name: Stargazer1011
site_url: https://stargazer1011.github.io/
site_description: moog moog moog moog moog
site_author: Stargazer 

theme:
  name: material
  palette:
    scheme: moog
  logo: img/moog.jpeg
  favicon: img/moog.jpeg
extra_css:
  - stylesheets/extra.css
nav:
  - Home: 'index.md'
  - 'Build Log':
    - 'Build log test':
        - 'Build log #1': 'build_log_1.md'
        - 'Latex test': 'test.tex'
  - 'Misc':
    - 'MarathonTraining Schedule': 'zero_to_marathon_training.md'

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

