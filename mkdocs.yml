site_name: Ernie's Website
site_url: https://stargazer1011.github.io/
site_description: moog moog moog moog moog moog
site_author: Ernie

theme:
  name: material
  palette:
    scheme: moog
  logo: img/moog.jpeg
  favicon: img/moog.jpeg
extra_css:
  - stylesheets/extra.css
nav:
  - Home: 'index.md'
  - 'portfolio':
    - 'UCSD':
      - 'SEDS Portfolio': 'SEDS_portfolio.md'

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true


extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

#steps to push code to github from vscode

#git add .
#git status (optional)
#git commit -m 'add commit message here'
#git push origin main

#If you added too large of a file:


#Locally delete large files.
#Commit the local deletes.
#Soft reset back X number of commits (for me it was 3): "git reset --soft HEAD~3".
#Then recommit all the changes together (AKA squash) "git commit -m "New message for the combined commit""
#Push squashed commit. (Note: You may have to force the push, using 'git push --force origin main')
